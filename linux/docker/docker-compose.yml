services:
  xa-gateway:
    # 自建镜像：官方 OpenClaw 2026.9.2 + OA 桥接插件与依赖，构建见 docker/Dockerfile
    image: xa-gateway-oa:2026.9.2
    container_name: xa-gateway
    # 以宿主机当前用户身份运行，~/xa 下的文件不用 chown。XA_UID / XA_GID 写在 .env（id -u / id -g）
    user: "${XA_UID:-1000}:${XA_GID:-1000}"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    environment:
      TZ: Asia/Shanghai
      HOME: /home/node
      OPENCLAW_GATEWAY_BIND: lan
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      # 凭据全部来自同目录的 .env（模板 docker/.env.example）。缺任何一项，docker compose 直接报错，不会带空值启动
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:?.env 缺 OPENCLAW_GATEWAY_TOKEN}
      XA_IT_WECOM_BOT_ID: ${XA_IT_WECOM_BOT_ID:?.env 缺 XA_IT_WECOM_BOT_ID}
      XA_IT_WECOM_BOT_SECRET: ${XA_IT_WECOM_BOT_SECRET:?.env 缺 XA_IT_WECOM_BOT_SECRET}
      XA_DOMESTIC_API_KEY: ${XA_DOMESTIC_API_KEY:?.env 缺 XA_DOMESTIC_API_KEY}
      XA_DOMESTIC_BASE_URL: ${XA_DOMESTIC_BASE_URL:?.env 缺 XA_DOMESTIC_BASE_URL}
      XA_DOMESTIC_MODEL_ID: ${XA_DOMESTIC_MODEL_ID:?.env 缺 XA_DOMESTIC_MODEL_ID}
      # Provider 键固定 bailian，完整引用由模型 ID 拼出来，不用另填
      XA_DOMESTIC_MODEL_REF: bailian/${XA_DOMESTIC_MODEL_ID}
      OA_MYSQL_HOST: ${OA_MYSQL_HOST:?.env 缺 OA_MYSQL_HOST}
      OA_MYSQL_PORT: ${OA_MYSQL_PORT:-3306}
      OA_MYSQL_USER: ${OA_MYSQL_USER:-xa_oa}
      OA_MYSQL_DATABASE: ${OA_MYSQL_DATABASE:-xa_oa}
      OA_MYSQL_PASSWORD: ${OA_MYSQL_PASSWORD:?.env 缺 OA_MYSQL_PASSWORD}
      OA_API_USER_ID: ${OA_API_USER_ID:?.env 缺 OA_API_USER_ID}
      OA_APP_SECRET: ${OA_APP_SECRET:?.env 缺 OA_APP_SECRET}
      WECOM_IDENTITY_CORPID: ${WECOM_IDENTITY_CORPID:?.env 缺 WECOM_IDENTITY_CORPID}
      WECOM_IDENTITY_SECRET: ${WECOM_IDENTITY_SECRET:?.env 缺 WECOM_IDENTITY_SECRET}
    volumes:
      - ./config:/home/node/.openclaw
      - ./workspace:/home/node/.openclaw/workspace
      - ./extensions:/home/node/.openclaw/extensions
      # OA 桥接业务配置（appId、公钥、建单开关等；数据库连接与凭据在 .env）
      - ./oa-bridge-config.json:/opt/xa/oa-workflow-bridge/bridge-config.json:ro
    # 只走本机 / SSH 隧道
    ports:
      - "127.0.0.1:18789:18789"
    # 镜像自带 tini 作为入口，这里只给启动命令
    command: ["node", "dist/index.js", "gateway", "--bind", "lan", "--port", "18789"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:18789/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
